<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoWorld - Liên hệ</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Liên hệ AutoWorld</h1>
      <nav>
        <a href="index.html">Trang chủ</a> |
        <a href="cars.html">Bộ sưu tập xe</a> |
        <a href="contact.html">Liên hệ</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Về chúng tôi</h2>
        <p>
          AutoWorld được tạo ra dành cho những người yêu xe. Website chia sẻ
          hình ảnh và thông tin về các mẫu xe, từ xe thể thao đến xe sang.
        </p>
        <img src="./picture/contact.jpg" alt="Ô tô đỗ ngoài trời" width="700" />
      </section>

      <section>
        <h2>Gửi lời nhắn</h2>
        <form action="#" method="get">
          <p>
            <label for="name">Họ và tên:</label><br />
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Nhập họ và tên"
            />
          </p>
          <p>
            <label for="email">Email:</label><br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Nhập email"
            />
          </p>
          <p>
            <label for="message">Nội dung:</label><br />
            <textarea
              id="message"
              name="message"
              rows="5"
              cols="40"
              placeholder="Nhập lời nhắn"
            ></textarea>
          </p>
          <p><input type="submit" value="Gửi" /></p>
        </form>
      </section>
    </main>

    <footer>
      <p>AutoWorld</p>
    </footer>
  </body>
</html>
